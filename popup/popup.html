<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Immersive Translate</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <h1>⚡ 超级翻译</h1>
      <div class="toggle-wrap">
        <label class="switch">
          <input type="checkbox" id="toggleBtn">
          <span class="slider"></span>
        </label>
        <span id="statusText">已关闭</span>
      </div>
    </div>

    <div class="section">
      <label>全页翻译引擎</label>
      <select id="engine">
        <option value="google">Google 翻译 (免费)</option>
        <option value="mymemory">MyMemory (免费)</option>
        <option value="lingva">Lingva Translate (免费)</option>
        <option value="libre">LibreTranslate (免费)</option>
        <option value="deepl">DeepL (需 API Key)</option>
        <option value="custom">自定义 API</option>
        <option value="openai">OpenAI (需 API Key)</option>
        <option value="gemini">Gemini (需 API Key)</option>
        <option value="claude">Claude (需 API Key)</option>
        <option value="ollama">Ollama (本地/自定义)</option>
      </select>
    </div>

    <div class="section">
      <label>目标语言</label>
      <select id="targetLang">
        <option value="zh-CN">简体中文</option>
        <option value="zh-TW">繁体中文</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="es">Español</option>
        <option value="ru">Русский</option>
        <option value="pt">Português</option>
        <option value="it">Italiano</option>
        <option value="ar">العربية</option>
        <option value="hi">हिन्दी</option>
        <option value="th">ไทย</option>
        <option value="vi">Tiếng Việt</option>
        <option value="id">Bahasa Indonesia</option>
        <option value="tr">Türkçe</option>
      </select>
    </div>

    <div class="section">
      <label>显示模式</label>
      <select id="displayMode">
        <option value="bilingual">双语对照 (原文 + 译文)</option>
        <option value="replace">译文替换 (悬停显示原文)</option>
        <option value="translationOnly">仅译文</option>
      </select>
    </div>

    <div class="section">
      <label>译文颜色</label>
      <div class="color-picker" id="colorPicker">
        <button class="color-dot" data-color="#9b59b6" title="紫色" style="background:#9b59b6"></button>
        <button class="color-dot" data-color="#4f8ef7" title="蓝色" style="background:#4f8ef7"></button>
        <button class="color-dot" data-color="#7c8aaa" title="灰色" style="background:#7c8aaa"></button>
        <button class="color-dot" data-color="#27ae60" title="绿色" style="background:#27ae60"></button>
        <button class="color-dot" data-color="#e67e22" title="橙色" style="background:#e67e22"></button>
        <button class="color-dot" data-color="#e74c3c" title="红色" style="background:#e74c3c"></button>
        <button class="color-dot" data-color="#00b894" title="青色" style="background:#00b894"></button>
      </div>
    </div>

    <div class="section toggle-group">
      <label class="toggle-label">
        <input type="checkbox" id="hoverTranslate">
        <span>鼠标悬停翻译段落</span>
      </label>
      <label class="toggle-label">
        <input type="checkbox" id="inputTranslate">
        <span>输入框实时翻译</span>
      </label>
    </div>

    <div class="divider"></div>

    <div class="section">
      <label>划词翻译模式</label>
      <select id="selectionMode">
        <option value="icon">图标模式 (选中后点击图标)</option>
        <option value="direct">直接弹窗 (选中即翻译)</option>
        <option value="dblclick">双击查词</option>
        <option value="shortcut">快捷键 (Alt+S)</option>
        <option value="off">关闭划词翻译</option>
      </select>
    </div>

    <div class="section">
      <label>划词翻译引擎 (多选)</label>
      <div class="checkbox-group" id="selectionEngines">
        <label><input type="checkbox" value="google" checked> 🔵 Google</label>
        <label><input type="checkbox" value="lingva" checked> 🟢 Lingva</label>
        <label><input type="checkbox" value="libre" checked> 🟣 Libre</label>
        <label><input type="checkbox" value="mymemory"> 🟡 MyMemory</label>
        <label><input type="checkbox" value="deepl"> 🔷 DeepL</label>
        <label><input type="checkbox" value="openai"> ⚪ OpenAI</label>
        <label><input type="checkbox" value="gemini"> ✨ Gemini</label>
        <label><input type="checkbox" value="claude"> 🔶 Claude</label>
        <label><input type="checkbox" value="ollama"> 🦙 Ollama</label>
      </div>
    </div>

    <div class="divider"></div>

    <div class="section deepl-settings" style="display:none">
      <label>DeepL API Key</label>
      <input type="password" id="deeplKey" placeholder="输入 DeepL API Key">
    </div>

    <div class="section custom-settings" style="display:none">
      <label>API 地址</label>
      <input type="text" id="customApiUrl" placeholder="https://api.example.com/translate">
      <label>API Key (可选)</label>
      <input type="password" id="customApiKey" placeholder="Bearer token">
    </div>

    <div class="section libre-settings" style="display:none">
      <label>LibreTranslate 地址</label>
      <input type="text" id="libreUrl" placeholder="https://libretranslate.com" value="https://libretranslate.com">
    </div>

    <div class="section openai-settings" style="display:none">
      <label>OpenAI API Key</label>
      <input type="password" id="openaiKey" placeholder="输入 OpenAI API Key">
      <div style="font-size: 12px; color: #666; margin-top: 4px;">更多模型配置请前往设置页</div>
    </div>

    <div class="section gemini-settings" style="display:none">
      <label>Gemini API Key</label>
      <input type="password" id="geminiKey" placeholder="输入 Gemini API Key">
      <div style="font-size: 12px; color: #666; margin-top: 4px;">更多模型配置请前往设置页</div>
    </div>

    <div class="section claude-settings" style="display:none">
      <label>Claude API Key</label>
      <input type="password" id="claudeKey" placeholder="输入 Claude API Key">
      <div style="font-size: 12px; color: #666; margin-top: 4px;">更多模型配置请前往设置页</div>
    </div>

    <div class="section ollama-settings" style="display:none">
      <div style="font-size: 12px; color: #666;">Ollama 配置请前往设置页</div>
    </div>

    <div class="footer">
      <div class="footer-shortcuts">
        <span class="shortcut">全页: Alt+T</span>
        <span class="shortcut">划词: Alt+S</span>
      </div>
      <div class="footer-links">
        <a href="#" id="openWordbook" class="footer-link">📖 单词本</a>
        <a href="#" id="openHistory" class="footer-link">📝 历史</a>
        <a href="#" id="openPDF" class="footer-link">📄 PDF</a>
        <a href="#" id="openSandbox" class="footer-link">🛠️ 快捷翻译</a>
        <a href="#" id="openSettings" class="footer-link">⚙️ 设置</a>
      </div>
    </div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
