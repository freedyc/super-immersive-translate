<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>单词本 - 超级翻译</title>
  <link rel="stylesheet" href="wordbook.css">
</head>
<body class="bg-base-200 text-base-content min-h-screen">

  <div class="flex min-h-screen">

    <!-- Sidebar -->
    <aside class="w-56 bg-base-300 flex flex-col shrink-0 min-h-screen">
      <!-- Logo -->
      <div class="p-4 border-b border-base-content/10">
        <div class="flex items-center gap-2 font-bold text-base">
          <i data-lucide="book-open" class="w-5 h-5 text-primary"></i>
          单词本
        </div>
      </div>

      <!-- Nav using daisyUI menu — JS toggles .active on the <a.nav-item> elements -->
      <nav class="flex-1 py-2">
        <ul class="menu menu-md gap-0.5 w-full px-0">
          <li>
            <a href="#" class="nav-item active" data-view="review">
              <i data-lucide="rotate-cw" class="w-4 h-4"></i>
              今日复习
            </a>
          </li>
          <li>
            <a href="#" class="nav-item" data-view="list">
              <i data-lucide="list" class="w-4 h-4"></i>
              单词列表
            </a>
          </li>
          <li>
            <a href="#" class="nav-item" data-view="cards">
              <i data-lucide="layers" class="w-4 h-4"></i>
              卡片学习
            </a>
          </li>
          <li>
            <a href="#" class="nav-item" data-view="quiz">
              <i data-lucide="pen-line" class="w-4 h-4"></i>
              拼写测验
            </a>
          </li>
          <li>
            <a href="#" class="nav-item" data-view="stats">
              <i data-lucide="bar-chart-2" class="w-4 h-4"></i>
              学习统计
            </a>
          </li>
        </ul>
      </nav>

      <!-- Sidebar footer: export/import -->
      <div class="p-3 border-t border-base-content/10 flex gap-2">
        <button id="exportBtn" class="btn btn-ghost btn-sm flex-1 gap-1">
          <i data-lucide="upload" class="w-4 h-4"></i>
          导出
        </button>
        <button id="importBtn" class="btn btn-ghost btn-sm flex-1 gap-1">
          <i data-lucide="download" class="w-4 h-4"></i>
          导入
        </button>
        <input type="file" id="importFile" accept=".json" class="hidden">
      </div>
    </aside>

    <!-- Main area -->
    <div class="flex-1 flex flex-col min-h-screen">

      <!-- Topbar -->
      <header class="navbar bg-base-100 shadow px-4 gap-3 sticky top-0 z-10">
        <div class="navbar-start flex-1">
          <input type="text" id="searchInput" placeholder="搜索单词..." class="input input-bordered input-sm w-64" />
        </div>
        <div class="navbar-end flex items-center gap-2">
          <span id="wordCount" class="badge badge-ghost">0 个单词</span>
          <button id="clearAllBtn" class="btn btn-error btn-sm btn-outline gap-1">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
            清空
          </button>
          <div id="themeControl"></div>
        </div>
      </header>

      <p class="text-xs text-base-content/40 text-center py-1">提示：开启 GitHub 同步后，删除的单词可能会在下次同步时从其他设备恢复</p>

      <!-- Views container -->
      <main class="flex-1 p-6">

        <!-- Review View -->
        <div id="reviewView" class="view active">
          <div class="max-w-4xl mx-auto mt-6">
            <div class="flex items-center justify-between mb-4">
              <h2 class="text-lg font-semibold">今日复习</h2>
              <div class="radial-progress text-primary" id="reviewProgressRing" style="--value:0; --size:3.25rem; --thickness:4px;" role="progressbar">
                <span id="reviewDueCount" class="text-xs font-bold">0</span>
              </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
              <div class="lg:col-span-2">
                <div id="reviewQuestion"></div>

                <div id="reviewEmpty" class="flex flex-col items-center justify-center py-16 text-base-content/50" style="display:none">
                  <i data-lucide="check-circle" class="w-16 h-16 mb-4 text-success/60"></i>
                  <h3 class="text-lg font-semibold mb-1 text-base-content/60">本轮复习完成 🎉</h3>
                  <button id="reviewLearnNewBtn" class="btn btn-primary btn-sm mt-4 gap-1">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    提前学新词
                  </button>
                </div>
              </div>

              <aside id="reviewGrammarHint" style="display:none"></aside>
            </div>
          </div>
        </div>

        <!-- List View -->
        <div id="listView" class="view">
          <div id="wordList" class="grid gap-4" style="grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));"></div>
          <div id="emptyState" class="flex flex-col items-center justify-center py-20 text-base-content/50">
            <i data-lucide="book-open" class="w-16 h-16 mb-4 text-base-content/30"></i>
            <h3 class="text-lg font-semibold mb-1 text-base-content/60">还没有收藏单词</h3>
            <p class="text-sm">在网页上划词翻译时，点击收藏星标即可添加</p>
          </div>
        </div>

        <!-- Cards View -->
        <div id="cardsView" class="view">
          <div class="max-w-lg mx-auto mt-8 text-center">
            <!-- Flashcard -->
            <div id="flashcard" class="flashcard w-full h-72 mb-6">
              <div class="flashcard-inner">
                <!-- Front -->
                <div class="flashcard-front bg-gradient-to-br from-primary to-secondary text-primary-content shadow-xl">
                  <div class="flex items-center gap-2 mb-1">
                    <div id="cardWord" class="text-4xl font-bold"></div>
                    <span id="cardPos" class="badge badge-outline border-primary-content/40 text-primary-content/80 badge-sm" style="display:none"></span>
                    <button id="cardSpeakBtn" class="btn btn-ghost btn-circle btn-sm text-primary-content" title="发音">
                      <i data-lucide="volume-2" class="w-4 h-4"></i>
                    </button>
                  </div>
                  <div id="cardIpa" class="text-sm opacity-70 font-mono mb-2"></div>
                  <div class="text-sm opacity-70 flex items-center gap-1">
                    <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i>
                    点击翻转
                  </div>
                </div>
                <!-- Back -->
                <div class="flashcard-back bg-base-100 border-2 border-base-300 shadow-xl">
                  <div id="cardTranslation" class="text-2xl font-semibold text-base-content mb-3"></div>
                  <div id="cardSource" class="text-sm text-base-content/50"></div>
                  <div id="cardExample" class="text-sm text-base-content/60 mt-3 px-4 leading-relaxed"></div>
                </div>
              </div>
            </div>

            <!-- Card navigation -->
            <div class="flex items-center justify-center gap-6 mb-5">
              <button id="cardPrev" class="btn btn-outline btn-sm gap-1">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                上一个
              </button>
              <span id="cardProgress" class="text-sm text-base-content/60 font-medium">0 / 0</span>
              <button id="cardNext" class="btn btn-outline btn-sm gap-1">
                下一个
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
              </button>
            </div>

            <!-- Card actions -->
            <div class="flex justify-center gap-3">
              <button id="cardShuffle" class="btn btn-secondary btn-sm gap-1">
                <i data-lucide="shuffle" class="w-4 h-4"></i>
                随机
              </button>
            </div>
          </div>
        </div>

        <!-- Quiz View -->
        <div id="quizView" class="view">
          <div class="max-w-md mx-auto mt-12 text-center">
            <div class="card bg-base-100 shadow-sm rounded-xl mb-6">
              <div class="card-body gap-4">
                <div id="quizPrompt" class="text-xl text-base-content/70 leading-relaxed"></div>
                <input type="text" id="quizInput" class="input input-bordered text-center text-lg" placeholder="输入单词..." autocomplete="off" />
                <div id="quizFeedback" class="quiz-feedback text-base font-semibold min-h-6"></div>
              </div>
            </div>

            <div class="flex justify-center gap-3 mb-5">
              <button id="quizCheck" class="btn btn-primary gap-1">
                <i data-lucide="check" class="w-4 h-4"></i>
                检查
              </button>
              <button id="quizSkip" class="btn btn-ghost gap-1">
                <i data-lucide="skip-forward" class="w-4 h-4"></i>
                跳过
              </button>
              <button id="quizNext" class="btn btn-primary gap-1" style="display:none">
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
                下一题
              </button>
            </div>

            <div class="badge badge-ghost badge-lg gap-2 p-3">
              正确: <span id="quizCorrect" class="font-bold">0</span>
              <span class="opacity-40">/</span>
              总计: <span id="quizTotal" class="font-bold">0</span>
            </div>
          </div>
        </div>

        <!-- Stats View -->
        <div id="statsView" class="view">
          <!-- Stat cards -->
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div class="stat bg-base-100 rounded-box shadow">
              <div class="stat-title">总单词数</div>
              <div id="statTotal" class="stat-value text-primary">0</div>
            </div>
            <div class="stat bg-base-100 rounded-box shadow">
              <div class="stat-title">已掌握</div>
              <div id="statKnown" class="stat-value text-success">0</div>
            </div>
            <div class="stat bg-base-100 rounded-box shadow">
              <div class="stat-title">待学习</div>
              <div id="statUnknown" class="stat-value text-warning">0</div>
            </div>
            <div class="stat bg-base-100 rounded-box shadow">
              <div class="stat-title">今日新增</div>
              <div id="statToday" class="stat-value text-info">0</div>
            </div>
          </div>

          <h3 class="text-base font-semibold mb-3">最近收藏</h3>
          <div id="recentWords" class="flex flex-wrap gap-2"></div>
        </div>

      </main>
    </div>
  </div>

  <script type="module" src="../utils/tts.js"></script>
  <script type="module" src="wordbook.js"></script>
</body>
</html>
