<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📖 单词本 - 超级翻译</title>
  <link rel="stylesheet" href="wordbook.css">
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo">⚡ 超级翻译</div>
      <nav class="nav">
        <a href="#" class="nav-item active" data-view="list">
          <span class="nav-icon">📚</span> 单词列表
        </a>
        <a href="#" class="nav-item" data-view="cards">
          <span class="nav-icon">🎴</span> 卡片学习
        </a>
        <a href="#" class="nav-item" data-view="quiz">
          <span class="nav-icon">✏️</span> 拼写测验
        </a>
        <a href="#" class="nav-item" data-view="stats">
          <span class="nav-icon">📊</span> 学习统计
        </a>
      </nav>
      <div class="sidebar-footer">
        <button id="exportBtn" class="btn-secondary">📤 导出</button>
        <button id="importBtn" class="btn-secondary">📥 导入</button>
        <input type="file" id="importFile" accept=".json" style="display:none">
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <!-- Header -->
      <header class="topbar">
        <div class="search-wrap">
          <input type="text" id="searchInput" placeholder="搜索单词..." class="search-input">
        </div>
        <div class="topbar-actions">
          <span id="wordCount" class="word-count">0 个单词</span>
          <button id="clearAllBtn" class="btn-danger">🗑️ 清空</button>
        </div>
      </header>

      <!-- Views -->
      <div id="listView" class="view active">
        <div id="wordList" class="word-list"></div>
        <div id="emptyState" class="empty-state">
          <div class="empty-icon">📖</div>
          <h3>还没有收藏单词</h3>
          <p>在网页上划词翻译时，点击 ⭐ 收藏单词到这里</p>
        </div>
      </div>

      <div id="cardsView" class="view">
        <div class="cards-container">
          <div id="flashcard" class="flashcard">
            <div class="flashcard-inner">
              <div class="flashcard-front">
                <div class="flashcard-word" id="cardWord"></div>
                <div class="flashcard-hint">点击翻转</div>
              </div>
              <div class="flashcard-back">
                <div class="flashcard-translation" id="cardTranslation"></div>
                <div class="flashcard-source" id="cardSource"></div>
              </div>
            </div>
          </div>
          <div class="cards-controls">
            <button id="cardPrev" class="btn-card">⬅️ 上一个</button>
            <span id="cardProgress" class="card-progress">0 / 0</span>
            <button id="cardNext" class="btn-card">下一个 ➡️</button>
          </div>
          <div class="cards-actions">
            <button id="cardKnow" class="btn-know">😊 认识</button>
            <button id="cardDontKnow" class="btn-dont-know">🤔 不认识</button>
            <button id="cardShuffle" class="btn-shuffle">🔀 随机</button>
          </div>
        </div>
      </div>

      <div id="quizView" class="view">
        <div class="quiz-container">
          <div id="quizCard" class="quiz-card">
            <div class="quiz-prompt" id="quizPrompt"></div>
            <input type="text" id="quizInput" class="quiz-input" placeholder="输入单词..." autocomplete="off">
            <div id="quizFeedback" class="quiz-feedback"></div>
          </div>
          <div class="quiz-controls">
            <button id="quizCheck" class="btn-primary">检查</button>
            <button id="quizSkip" class="btn-secondary">跳过</button>
            <button id="quizNext" class="btn-primary" style="display:none">下一题</button>
          </div>
          <div id="quizScore" class="quiz-score">
            正确: <span id="quizCorrect">0</span> / 总计: <span id="quizTotal">0</span>
          </div>
        </div>
      </div>

      <div id="statsView" class="view">
        <div class="stats-container">
          <div class="stat-card">
            <div class="stat-number" id="statTotal">0</div>
            <div class="stat-label">总单词数</div>
          </div>
          <div class="stat-card">
            <div class="stat-number" id="statKnown">0</div>
            <div class="stat-label">已掌握</div>
          </div>
          <div class="stat-card">
            <div class="stat-number" id="statUnknown">0</div>
            <div class="stat-label">待学习</div>
          </div>
          <div class="stat-card">
            <div class="stat-number" id="statToday">0</div>
            <div class="stat-label">今日新增</div>
          </div>
        </div>
        <div class="recent-title">最近收藏</div>
        <div id="recentWords" class="recent-words"></div>
      </div>
    </main>
  </div>
  <script src="wordbook.js"></script>
</body>
</html>
